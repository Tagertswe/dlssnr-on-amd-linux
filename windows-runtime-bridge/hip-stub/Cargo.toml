[package]
name = "amdhip64-stub"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Clean-room stub implementation of the HIP runtime import surface used by danielblnc/DLSS-NR-on-AMD's standalone proxy DLL, for isolating load/hook behavior under Proton without a real ROCm/HIP dependency."

[lib]
name = "amdhip64_7"
crate-type = ["cdylib"]

[profile.release]
panic = "abort"

[dependencies]
hip-bridge-protocol = { path = "../hip-bridge/protocol" }
