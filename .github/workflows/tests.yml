name: tests

# Deliberately pull_request, not pull_request_target: this runs with a
# read-only token and no secrets even for PRs from forks. Never switch
# this to pull_request_target without re-reading why - that trigger runs
# with the base repo's permissions/secrets against PR-controlled code,
# which is the classic Actions supply-chain hole.
on:
  push:
    branches: [main]
  pull_request:

# Repo-wide default can be read/write depending on org settings; pin it
# down explicitly here since this workflow never needs to write anything.
permissions:
  contents: read

jobs:
  hip-unixlib-unit-tests:
    name: daniel/hip-unixlib make test
    runs-on: ubuntu-latest
    steps:
      # Pinned to a commit SHA (actions/checkout v4.2.2), not a mutable
      # tag - a tag can be moved by a compromised upstream account, a
      # SHA can't.
      - name: Check out repo
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      # Only daniel/hip-unixlib's pure-module tests run in CI - they're
      # plain host gcc, no Wine/ROCm/GPU dependency. Everything else in
      # this repo needs real Wine + a real ROCm install + a real AMD GPU
      # and is validated locally by hand (see docs/linux-support-spec.md);
      # a green run here does not by itself clear a PR that touches
      # native.c/pe_shim.c for merge.
      - name: make test
        working-directory: daniel/hip-unixlib
        run: make test
